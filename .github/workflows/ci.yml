name: Selective Tests Demo

on:
  pull_request:
    branches: [main]

jobs:
  selective-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historico completo: 'git diff' contra o branch base precisa dele.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build da ferramenta de selecao
        run: mvn -q -f pom.xml package -DskipTests

      - name: Selecionar e rodar so os testes afetados
        run: |
          ./scripts/select-tests.sh \
            "origin/${{ github.base_ref }}" \
            "HEAD" \
            "examples/sample-java-project" \
            "$(pwd)/target/test-graph-selector-0.1.0-SNAPSHOT.jar"

  full-suite-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Rodar suite completa (para comparacao de tempo)
        run: mvn -q -f examples/sample-java-project/pom.xml test
