name: "test-graph-selector"
description: "Roda so os testes afetados pelo diff (grafo de dependencias via AST), explicando por que cada um foi escolhido."
author: "Pedronovaesdev"
branding:
  icon: "filter"
  color: "blue"

inputs:
  base:
    description: "Commit de comparacao. Vazio = base do PR (pull_request), base do grupo (merge_group) ou commit anterior ao push. Sem base disponivel, roda a suite completa."
    required: false
    default: ""
  head:
    description: "Commit analisado."
    required: false
    default: "HEAD"
  project:
    description: "Pasta do projeto dentro do repositorio (monorepo)."
    required: false
    default: "."
  lang:
    description: "typescript, angular, vitest, java, java-gradle ou python, ou o caminho de um .yml do projeto. Vazio = detecta pelo arquivo de build."
    required: false
    default: ""
  dry-run:
    description: "true = so seleciona e explica, sem rodar os testes."
    required: false
    default: "false"
  graphify-version:
    description: "Versao do indexador AST (graphifyy no PyPI)."
    required: false
    default: "0.9.90"
  cache:
    description: "true = guarda o cache do graphify entre execucoes (so os arquivos alterados sao relidos)."
    required: false
    default: "true"
  skip-tested-tree:
    description: "true = pula tudo se este conteudo (tree do git) ja passou com a mesma ferramenta, configuracao e runner. O que esta fora do repositorio (servicos, segredos) nao entra na chave."
    required: false
    default: "false"

outputs:
  mode:
    description: "selective, full, none, fail-safe ou skipped (arvore ja testada)."
    value: ${{ steps.run.outputs.mode || steps.skipped.outputs.mode }}
  selected:
    description: "Quantos testes foram selecionados."
    value: ${{ steps.run.outputs.selected || steps.skipped.outputs.selected }}
  total:
    description: "Quantos testes existem no projeto."
    value: ${{ steps.run.outputs.total }}
  report:
    description: "Caminho do report.json."
    value: ${{ steps.run.outputs.report }}

runs:
  using: "composite"
  steps:
    # Arvore ja testada: mesmo conteudo (tree do git) que ja passou, com a
    # mesma ferramenta, configuracao e runner. O cache guarda so a chave
    # (lookup-only: nada e baixado). Pega re-runs e rebases sem mudanca de
    # conteudo. O cache do GitHub nao deixa a main ler o de um PR.
    - name: Chave da arvore testada
      id: tree
      if: inputs.skip-tested-tree == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head }}
        PROJECT: ${{ inputs.project }}
        LANG_INPUT: ${{ inputs.lang }}
        GRAPHIFY_VERSION: ${{ inputs.graphify-version }}
      run: |
        key="$(
          {
            git rev-parse "$HEAD_REF^{tree}"
            printf '%s\n' "$PROJECT" "$LANG_INPUT" "$GRAPHIFY_VERSION" "${ImageOS:-}" "${ImageVersion:-}" "$(node --version 2>/dev/null || true)"
            cat "$GITHUB_ACTION_PATH/selector/dist/cli.js" "$GITHUB_ACTION_PATH"/selector/languages/*.yml
          } | git hash-object --stdin
        )"
        echo "key=tgs-tested-${{ runner.os }}-$key" >> "$GITHUB_OUTPUT"

    - name: Procurar a arvore entre as ja testadas
      id: tested
      if: steps.tree.outputs.key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/tgs-tested
        key: ${{ steps.tree.outputs.key }}
        lookup-only: true

    - name: Arvore ja testada
      id: skipped
      if: steps.tested.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "::notice::Este conteudo ja passou nos testes (${{ steps.tree.outputs.key }}): nada a rodar."
        printf '## Selecao de testes\n\n**Arvore ja testada com sucesso**: testes pulados.\n' >> "$GITHUB_STEP_SUMMARY"
        printf 'mode=skipped\nselected=0\n' >> "$GITHUB_OUTPUT"

    # O graphify vai num venv proprio: nao mexe no Python do projeto e evita o
    # bloqueio de "pip install" global do Ubuntu 24.04 (PEP 668).
    - name: Instalar o indexador AST (graphify)
      if: steps.skipped.outcome != 'success'
      shell: bash
      env:
        GRAPHIFY_VERSION: ${{ inputs.graphify-version }}
      run: |
        python3 -m venv "$RUNNER_TEMP/tgs-venv"
        "$RUNNER_TEMP/tgs-venv/bin/pip" install --quiet "graphifyy==$GRAPHIFY_VERSION"
        echo "GRAPHIFY=$RUNNER_TEMP/tgs-venv/bin/graphify" >> "$GITHUB_ENV"

    # O seletor vem pronto em selector/dist/cli.js (um arquivo so, com as
    # dependencias embutidas): nada de npm ci nem build aqui. Usa o Node que ja
    # estiver no runner (nao troca a versao do projeto).
    - name: Conferir o Node
      if: steps.skipped.outcome != 'success'
      shell: bash
      run: |
        command -v node >/dev/null || { echo "::error::Node.js nao encontrado. Adicione actions/setup-node antes desta Action."; exit 2; }
        node --version

    # Cache por conteudo de arquivo do graphify. O grafo em si (graph.json) e
    # sempre regerado para o commit analisado; so a extracao de cada arquivo e
    # reaproveitada. A chave muda a cada commit, e restore-keys pega o cache
    # mais recente do mesmo projeto.
    - name: Cache do indexador
      if: inputs.cache == 'true' && steps.skipped.outcome != 'success'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project }}/graphify-out
        key: tgs-graphify-${{ runner.os }}-${{ inputs.graphify-version }}-${{ inputs.project }}-${{ github.sha }}
        restore-keys: |
          tgs-graphify-${{ runner.os }}-${{ inputs.graphify-version }}-${{ inputs.project }}-

    - name: Definir a base da comparacao
      id: base
      if: steps.skipped.outcome != 'success'
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        base="$INPUT_BASE"
        if [ -z "$base" ]; then
          case "$EVENT_NAME" in
            pull_request|pull_request_target) base="$PR_BASE" ;;
            merge_group) base="$GROUP_BASE" ;;   # todos os PRs do grupo, nao so o ultimo commit
            *) base="$PUSH_BEFORE" ;;
          esac
        fi
        [ "$base" = "0000000000000000000000000000000000000000" ] && base=""
        # Sem base confiavel nao ha como saber o que mudou: suite completa.
        # (Comparar com HEAD~1 deixaria de fora os outros commits do push.)
        if [ -z "$base" ]; then
          echo "::warning::Sem commit de comparacao (push de branch nova?): rodando a suite completa."
          echo "full=sem commit de comparacao (push de branch nova?)" >> "$GITHUB_OUTPUT"
        elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "::warning::Commit base '$base' fora do clone (use actions/checkout com fetch-depth: 0): rodando a suite completa."
          echo "full=commit base $base fora do clone (checkout raso?)" >> "$GITHUB_OUTPUT"
        fi
        echo "sha=$base" >> "$GITHUB_OUTPUT"

    - name: Testes seletivos
      id: run
      if: steps.skipped.outcome != 'success'
      shell: bash
      env:
        TGS: ${{ github.action_path }}/selector/bin/select-tests.sh
        TGS_NO_BUILD: "1"
        BASE: ${{ steps.base.outputs.sha }}
        FULL_REASON: ${{ steps.base.outputs.full }}
        HEAD_REF: ${{ inputs.head }}
        PROJECT: ${{ inputs.project }}
        LANG_INPUT: ${{ inputs.lang }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if [ -n "$FULL_REASON" ]; then
          args=(--full-suite "$FULL_REASON" --project "$PROJECT")
        else
          args=(--base "$BASE" --head "$HEAD_REF" --project "$PROJECT")
        fi
        [ -n "$LANG_INPUT" ] && args+=(--lang "$LANG_INPUT")
        [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
        out="$PROJECT/.selector-out"
        rm -rf "$out"

        set +e
        bash "$TGS" "${args[@]}"
        code=$?
        set -e

        report="$out/report.json"
        if [ -f "$report" ]; then
          node -e '
            const r = require(require("path").resolve(process.argv[1]));
            const lines = [`mode=${r.mode}`, `selected=${r.summary.selected}`, `total=${r.summary.total}`];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          ' "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
        else
          echo "mode=fail-safe" >> "$GITHUB_OUTPUT"
        fi
        exit $code

    # So depois de testes que passaram de verdade (nao em --dry-run).
    - name: Marcar a arvore como testada
      if: success() && steps.tree.outputs.key != '' && steps.skipped.outcome != 'success'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/tgs-tested"
        echo "${{ steps.tree.outputs.key }}" > "$RUNNER_TEMP/tgs-tested/key"
    - name: Guardar a arvore testada
      if: success() && steps.tree.outputs.key != '' && steps.skipped.outcome != 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/tgs-tested
        key: ${{ steps.tree.outputs.key }}
