<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="test-graph-selector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- arestas do grafo: as acesas sao o caminho do arquivo alterado ate o teste -->
  <g stroke="#93c5fd" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="30" y1="34" x2="60" y2="60"/>
    <line x1="90" y1="34" x2="60" y2="60"/>
    <line x1="90" y1="34" x2="92" y2="88"/>
  </g>
  <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="60" x2="30" y2="88"/>
    <line x1="30" y1="34" x2="30" y2="88"/>
  </g>
  <!-- nos -->
  <circle cx="30" cy="34" r="10" fill="#f97316" stroke="#fff" stroke-width="3"/>
  <circle cx="90" cy="34" r="8" fill="#dbeafe"/>
  <circle cx="60" cy="60" r="8" fill="#fde68a"/>
  <circle cx="92" cy="88" r="8" fill="#dbeafe" opacity="0.7"/>
  <!-- teste selecionado -->
  <circle cx="30" cy="88" r="13" fill="#22c55e" stroke="#fff" stroke-width="3"/>
  <path d="M23.5 88.5 l4.5 4.5 l8.5 -9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
