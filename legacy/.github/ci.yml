name: Selective Tests Demo

on:
  pull_request:
    branches: [main]

jobs:
  # Builda o motor Java uma vez; os tres jobs de linguagem abaixo reusam o jar
  # via artifact, em vez de cada um compilar de novo.
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build do test-graph-selector
        run: mvn -q -f pom.xml package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: tool-jar
          path: target/test-graph-selector-*.jar

  selective-tests-java:
    needs: build-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 'git diff' contra o branch base precisa do historico completo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: tool-jar
          path: target
      - name: Selecionar e rodar so os testes Java afetados
        run: |
          ./scripts/select-tests.sh \
            "origin/${{ github.base_ref }}" "HEAD" \
            "examples/sample-java-project" \
            "$(pwd)/target/test-graph-selector-0.1.0-SNAPSHOT.jar"

  selective-tests-python:
    needs: build-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - uses: actions/download-artifact@v4
        with:
          name: tool-jar
          path: target
      - name: Selecionar e rodar so os testes Python afetados
        run: |
          ./scripts/select-tests-python.sh \
            "origin/${{ github.base_ref }}" "HEAD" \
            "examples/sample-python-project" \
            "$(pwd)/target/test-graph-selector-0.1.0-SNAPSHOT.jar"

  selective-tests-node:
    needs: build-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: extractors/node
      - run: npm install
        working-directory: examples/sample-node-project
      - uses: actions/download-artifact@v4
        with:
          name: tool-jar
          path: target
      - name: Selecionar e rodar so os testes Node afetados
        run: |
          ./scripts/select-tests-node.sh \
            "origin/${{ github.base_ref }}" "HEAD" \
            "examples/sample-node-project" \
            "$(pwd)/target/test-graph-selector-0.1.0-SNAPSHOT.jar"

  full-suite-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Rodar suite completa Java (para comparacao de tempo)
        run: mvn -q -f examples/sample-java-project/pom.xml test
